<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afife Ofisi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@1,500;1,600&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Yerleşim: tam ekran izometrik ofis; üstte başlık ve departman şeridi, altta görev kutusu,
   solda çalışan kartı, sağda açılır Takvim/Akış paneli. Renkler Atölye Afife kimliğinden. */
:root {
  --zemin: #F4EEE4;
  --kart: #FFFDF8;
  --metin: #2D402E;
  --soluk: #6B7F61;
  --vurgu: #E75F27;
  --vurgu-metin: #FFFAED;
  --cizgi: rgba(45, 64, 46, .14);
  --golge: 0 14px 40px rgba(45, 64, 46, .16);
  --hap: #2D402E;
  --hap-metin: #FFFAED;
  --basari: #2F8F5B;
  --basari-zemin: #DDF1E4;
  --hata: #C0392B;
  /* Sahnedeki etiketler ahşap/beyaz zeminin üstünde durur; iki temada da aynı kalır. */
  --etiket-zemin: rgba(255, 253, 248, .94);
  --etiket-metin: #2D402E;
  --etiket-koyu: #2D402E;
  --etiket-koyu-metin: #FFFAED;
  --f-govde: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-sanat: 'Libre Bodoni', 'Bodoni 72', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #151A16; --kart: #212822; --metin: #F3EBDD; --soluk: #A9B59E; --vurgu: #F07A45;
    --vurgu-metin: #1B1410; --cizgi: rgba(255, 250, 237, .12); --golge: 0 14px 40px rgba(0, 0, 0, .45);
    --hap: #FFFAED; --hap-metin: #2D402E; --basari: #5CC08A; --basari-zemin: #1E3A2A; --hata: #EF7B6A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #151A16; --kart: #212822; --metin: #F3EBDD; --soluk: #A9B59E; --vurgu: #F07A45;
  --vurgu-metin: #1B1410; --cizgi: rgba(255, 250, 237, .12); --golge: 0 14px 40px rgba(0, 0, 0, .45);
  --hap: #FFFAED; --hap-metin: #2D402E; --basari: #5CC08A; --basari-zemin: #1E3A2A; --hata: #EF7B6A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--zemin); color: var(--metin);
  font: 400 14px/1.45 var(--f-govde); -webkit-font-smoothing: antialiased;
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }

#sahne { position: fixed; inset: 0; }
#sahne canvas { display: block; touch-action: none; }
#etiketler { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- Üst bar ---------- */
.ust {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px;
}
.ust > * { pointer-events: auto; }
.ust-satir { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.marka { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marka svg { width: 38px; height: 38px; flex: none; }
.marka h1 { margin: 0; font: 600 18px/1.1 var(--f-govde); letter-spacing: -.01em; }
.marka h1 em { font: italic 600 20px/1 var(--f-sanat); color: var(--vurgu); }
.marka small { display: block; color: var(--soluk); font-size: 12px; font-variant-numeric: tabular-nums; }
.ust-tuslar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.durum {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 99px;
  background: var(--kart); border: 1px solid var(--cizgi); font-size: 12px; font-weight: 500;
}
.durum i { width: 8px; height: 8px; border-radius: 50%; background: var(--soluk); }
.durum.canli i { background: var(--basari); box-shadow: 0 0 0 4px var(--basari-zemin); }
.tus {
  border: 1px solid var(--cizgi); background: var(--kart); border-radius: 99px; padding: 6px 13px;
  font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center;
}
.tus:hover { border-color: var(--vurgu); }
.tus[aria-pressed="true"] { background: var(--hap); color: var(--hap-metin); border-color: var(--hap); }

.departmanlar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.departmanlar::-webkit-scrollbar { display: none; }
.dep-cip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px;
  border-radius: 99px; border: 1px solid var(--cizgi); background: var(--kart); font-size: 12.5px; font-weight: 500;
}
.dep-cip i { width: 8px; height: 8px; border-radius: 3px; }
.dep-cip b { font-weight: 600; color: var(--soluk); font-variant-numeric: tabular-nums; }

/* ---------- İş devri bandı ---------- */
.devir {
  position: fixed; left: 50%; top: calc(118px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-radius: 99px;
  background: var(--kart); box-shadow: var(--golge); border: 1px solid var(--cizgi);
  font-size: 13px; white-space: nowrap; max-width: calc(100vw - 32px);
}
.devir small { font-size: 10.5px; letter-spacing: .14em; color: var(--vurgu); font-weight: 600; }
.devir .k { padding: 4px 11px; border-radius: 99px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.devir .k.gm { background: var(--vurgu); color: var(--vurgu-metin); }
.devir .k.hedef { border: 1.5px solid var(--metin); }
@media (prefers-reduced-motion: no-preference) { .devir:not([hidden]) { animation: yuksel .35s ease-out; } }
@keyframes yuksel { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ---------- Sahne etiketleri ---------- */
.et {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap;
  font-size: 11.5px; font-weight: 500; line-height: 1;
}
.et-ajan {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px 5px 8px;
  background: var(--etiket-zemin); color: var(--etiket-metin); border-radius: 99px; border: 0;
  box-shadow: 0 2px 8px rgba(45, 64, 46, .18); transform-origin: left center;
}
.et-ajan i { width: 7px; height: 7px; border-radius: 50%; }
.et-ajan small { font-size: 10px; color: #6B7F61; font-weight: 500; }
.et-ajan.gm { background: var(--etiket-koyu); color: var(--etiket-koyu-metin); }
.et-ajan.gm small { color: #C9D2BF; }
.et-ajan.aktif { box-shadow: 0 0 0 2px var(--vurgu), 0 4px 14px rgba(231, 95, 39, .35); }
.et-dep {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 7px; border-radius: 6px;
  background: var(--etiket-koyu); color: var(--etiket-koyu-metin);
  font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
}
.et-dep i { width: 3px; height: 12px; border-radius: 2px; }
#etiketler.uzak .et-ajan { display: none; }
#etiketler.uzak .et-dep { font-size: 8.5px; padding: 3px 7px 3px 5px; letter-spacing: .08em; }
.balon {
  max-width: 230px; white-space: normal; padding: 9px 13px; border-radius: 14px; font-size: 12.5px;
  line-height: 1.35; font-weight: 500; background: #FFF3D6; color: #3B2E1E;
  box-shadow: 0 6px 18px rgba(45, 64, 46, .2); transform-origin: bottom center;
}
.balon::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
  background: inherit; transform: rotate(45deg); border-radius: 2px;
}
.balon.tamam { background: #D7F0E1; color: #1F4A33; }
.balon.yeni { background: #2D402E; color: #FFFAED; }
.balon.hata { background: #FBDAD5; color: #6E1F14; }
.yaziyor { display: inline-flex; gap: 4px; }
.yaziyor i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .35; }
@media (prefers-reduced-motion: no-preference) {
  .yaziyor i { animation: nokta 1s infinite; }
  .yaziyor i:nth-child(2) { animation-delay: .15s; } .yaziyor i:nth-child(3) { animation-delay: .3s; }
  .balon { animation: pop .25s ease-out; }
}
@keyframes nokta { 50% { opacity: 1; transform: translateY(-2px); } }
@keyframes pop { from { opacity: 0; scale: .85; } }

/* ---------- Görev kutusu ---------- */
.komut {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(720px, calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px))));
  background: var(--kart); border: 1px solid var(--cizgi); border-radius: 18px; box-shadow: var(--golge);
  padding: 12px 12px 10px 16px;
}
.komut textarea {
  width: 100%; border: 0; background: transparent; resize: none; outline: none; font-size: 14.5px;
  line-height: 1.45; min-height: 44px; max-height: 120px;
}
.komut textarea::placeholder { color: var(--soluk); }
.komut-alt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--cizgi); padding-top: 9px; }
.komut-alt label[for="komut-kime"] { font-size: 12px; color: var(--soluk); }
.komut select {
  flex: 1 1 200px; min-width: 0; border: 1px solid var(--cizgi); background: var(--zemin); border-radius: 10px;
  padding: 7px 10px; font-size: 13px;
}
.demo-sec { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.demo-sec input { accent-color: var(--vurgu); width: 16px; height: 16px; }
.ipucu { font-size: 11px; color: var(--soluk); border: 1px solid var(--cizgi); border-radius: 6px; padding: 2px 6px; }
.gonder {
  margin-left: auto; border: 0; border-radius: 12px; padding: 9px 16px; background: var(--vurgu);
  color: var(--vurgu-metin); font-weight: 600; font-size: 13.5px;
}
.gonder:disabled { opacity: .5; cursor: progress; }
@media (max-width: 560px) { .durum span { display: none; } .durum { padding: 9px; } .ipucu, .komut-alt label[for="komut-kime"] { display: none; } .komut select { flex-basis: 100%; order: -1; } }

/* ---------- Çalışan kartı ---------- */
.kart {
  position: fixed; z-index: 6; left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 32px));
  background: var(--kart); border: 1px solid var(--cizgi); border-radius: 18px; box-shadow: var(--golge);
  padding: 16px 18px 14px; overflow: hidden;
}
.kart-ust { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--soluk); }
.kart-ust i { width: 8px; height: 8px; border-radius: 50%; }
.kart-ust span:last-child { margin-left: auto; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.kart h2 { margin: 6px 0 2px; font: 600 24px/1.15 var(--f-govde); letter-spacing: -.02em; text-wrap: balance; }
.kart p { margin: 0 0 10px; color: var(--soluk); font-size: 13px; }
.ciplar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.cip { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--zemin); border: 1px solid var(--cizgi); }
.kart .zaman { font-size: 12.5px; color: var(--metin); display: flex; gap: 6px; align-items: baseline; }
.kart .zaman b { font: italic 600 16px/1 var(--f-sanat); color: var(--vurgu); }
.ciktilar { display: grid; gap: 4px; margin-bottom: 10px; }
.ciktilar button { text-align: left; border: 1px solid var(--cizgi); background: var(--zemin); border-radius: 8px; padding: 6px 9px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kart-alt { display: flex; align-items: center; gap: 8px; }
.model { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: color-mix(in srgb, var(--vurgu) 14%, transparent); color: var(--vurgu); }
.tur-tuslar { display: flex; gap: 2px; margin-left: auto; }
.tur-tuslar button, .kapat { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; color: var(--soluk); font-size: 15px; }
.tur-tuslar button:hover, .kapat:hover { background: var(--zemin); color: var(--metin); }
.kart-gorev { border: 1px solid var(--metin); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; }
.ilerleme { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.ilerleme i { display: block; height: 100%; width: 0; }

/* ---------- Yan panel ---------- */
.panel {
  position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(118px + env(safe-area-inset-top, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column;
  background: var(--kart); border: 1px solid var(--cizgi); border-radius: 18px; box-shadow: var(--golge);
}
.panel header { display: flex; align-items: center; padding: 12px 10px 10px 16px; border-bottom: 1px solid var(--cizgi); }
.panel h3 { margin: 0; font-size: 15px; font-weight: 600; }
.panel h3 small { font-weight: 400; color: var(--soluk); font-size: 12px; margin-left: 6px; }
.panel .kapat { margin-left: auto; }
.panel-ic { overflow-y: auto; padding: 8px 10px 12px; display: grid; gap: 6px; align-content: start; min-height: 0; flex: 1; }
.satir {
  display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 9px 8px; border-radius: 10px;
  border: 0; background: transparent; text-align: left; width: 100%;
}
.satir:hover { background: var(--zemin); }
.satir .saat { font: italic 600 17px/1.1 var(--f-sanat); color: var(--vurgu); font-variant-numeric: tabular-nums; }
.satir .saat small { display: block; font: 500 10.5px/1.3 var(--f-govde); color: var(--soluk); margin-top: 3px; }
.satir strong { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.satir strong i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.satir span { font-size: 12px; color: var(--soluk); display: block; min-width: 0; }
.akis-bos { color: var(--soluk); font-size: 13px; padding: 14px 8px; }
.akis-satir { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 7px 8px; font-size: 12.5px; border-radius: 8px; }
.akis-satir time { color: var(--soluk); font-variant-numeric: tabular-nums; font-size: 11.5px; padding-top: 1px; }
.akis-satir b { font-weight: 600; }
.akis-satir.hata { color: var(--hata); }
.akis-satir button { margin-top: 4px; border: 1px solid var(--cizgi); background: var(--zemin); border-radius: 99px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; }

/* ---------- Rapor penceresi ---------- */
.perde {
  position: fixed; inset: 0; z-index: 20; background: rgba(21, 26, 22, .45); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.rapor {
  width: min(680px, 100%); max-height: 100%; overflow-y: auto; background: var(--kart); border-radius: 20px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .35); padding: 14px;
}
.rapor-bas { border-radius: 14px; padding: 18px 20px; color: #FFFAED; position: relative; overflow: hidden; }
.rapor-bas small { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.rapor-bas h2 { margin: 4px 0 0; font: 600 24px/1.2 var(--f-govde); letter-spacing: -.02em; text-wrap: balance; }
.rapor-bas .tarih { position: absolute; top: 14px; right: 14px; font-size: 11px; padding: 3px 10px; border-radius: 99px; background: rgba(255, 250, 237, .2); }
.rapor-bas .kapat { position: absolute; bottom: 10px; right: 10px; color: #FFFAED; }
.ornek { margin: 10px 4px 0; font-size: 11.5px; color: var(--soluk); display: flex; gap: 6px; align-items: center; }
.ornek i { width: 6px; height: 6px; border-radius: 50%; background: var(--vurgu); }
.rapor-ic { padding: 4px 8px 6px; font-size: 13.5px; }
.rapor-ic .ozet { margin: 12px 0 4px; padding: 10px 14px; border-left: 3px solid var(--vurgu); background: var(--zemin); border-radius: 0 10px 10px 0; }
.rapor-ic h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 600; }
.rapor-ic h4 { font-size: 13.5px; margin: 14px 0 6px; }
.rapor-ic p { margin: 6px 0; }
.rapor-ic ul, .rapor-ic ol { margin: 6px 0; padding-left: 22px; display: grid; gap: 5px; }
.rapor-ic ol { counter-reset: s; list-style: none; padding-left: 0; }
.rapor-ic ol li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 10px; border: 1px solid var(--cizgi); border-radius: 10px; }
.rapor-ic ol li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; background: var(--hap); color: var(--hap-metin); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.rapor-ic code { font-size: 12px; background: var(--zemin); padding: 1px 5px; border-radius: 4px; }
.tablo { overflow-x: auto; margin: 6px 0; }
.tablo table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tablo th { text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soluk); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--cizgi); }
.tablo td { padding: 7px 8px; border-bottom: 1px solid var(--cizgi); }
.hata-ekran { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div id="sahne" aria-label="Atölye Afife ofisinin izometrik görünümü"></div>
<div id="etiketler"></div>

<header class="ust">
  <div class="ust-satir">
    <div class="marka">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#E75F27"/><text x="20" y="27" text-anchor="middle" font-family="Libre Bodoni, Georgia, serif" font-style="italic" font-weight="600" font-size="22" fill="#FFFAED">a</text></svg>
      <div>
        <h1>Afife <em>ofisi</em></h1>
        <small id="sayac">yükleniyor…</small>
      </div>
    </div>
    <div class="ust-tuslar">
      <span class="durum" id="durum"><i></i><span>Demo modu</span></span>
      <button class="tus" id="tus-tur" type="button">▶ Ofisi gez</button>
      <button class="tus" id="tus-takvim" type="button" aria-pressed="false">Takvim</button>
      <button class="tus" id="tus-akis" type="button" aria-pressed="false">Akış</button>
    </div>
  </div>
  <nav class="departmanlar" id="departmanlar" aria-label="Departmanlar"></nav>
</header>

<div class="devir" id="devir" hidden>
  <small>İŞ DEVRİ</small><span class="k gm" id="devir-kimden">Genel Müdür</span><span aria-hidden="true">→</span><span class="k hedef" id="devir-kime"></span>
</div>

<aside class="kart" id="kart" hidden aria-live="polite">
  <div class="kart-ust"><i id="kart-nokta"></i><span id="kart-dep"></span><span id="kart-sira"></span></div>
  <h2 id="kart-ad"></h2>
  <p id="kart-aciklama"></p>
  <div class="ciplar" id="kart-baglanti"></div>
  <p class="zaman" id="kart-zaman" hidden></p>
  <div class="ciktilar" id="kart-ciktilar"></div>
  <div class="kart-alt">
    <span class="model" id="kart-model"></span>
    <button class="kart-gorev" id="kart-gorev" type="button">Görev ver</button>
    <div class="tur-tuslar">
      <button type="button" id="tur-geri" aria-label="Önceki çalışan">‹</button>
      <button type="button" id="tur-dur" aria-label="Turu duraklat">⏸</button>
      <button type="button" id="tur-ileri" aria-label="Sonraki çalışan">›</button>
      <button type="button" id="kart-kapat" aria-label="Kartı kapat">✕</button>
    </div>
  </div>
  <div class="ilerleme"><i id="kart-ilerleme"></i></div>
</aside>

<aside class="panel" id="panel" hidden>

const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
function md(s) {
  const L = s.replace(/\r/g, '').split('\n'); let h = '', i = 0;
  const blok = /^(#{1,4}\s|\||\s*[-*]\s|\s*\d+\.\s|>)/;
  while (i < L.length) {
    const l = L[i]; let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(m[1].length + 1, 5); h += `<h${n}>${inl(m[2])}</h${n}>`; i++; continue; }
    if (/^\|/.test(l)) {
      const r = []; while (i < L.length && /^\|/.test(L[i])) r.push(L[i++]);
      const hucre = x => x.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const satirlar = r.filter(x => !/^[\s|:-]+$/.test(x));
      h += '<div class="tablo"><table><thead><tr>' + hucre(satirlar[0]).map(c => `<th>${inl(c)}</th>`).join('') + '</tr></thead><tbody>' +
        satirlar.slice(1).map(x => '<tr>' + hucre(x).map(c => `<td>${inl(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)) { let li = ''; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) li += `<li>${inl(L[i++].replace(/^\s*[-*]\s+/, ''))}</li>`; h += `<ul>${li}</ul>`; continue; }
    if (/^\s*\d+\.\s+/.test(l)) { let li = ''; while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) li += `<li><span>${inl(L[i++].replace(/^\s*\d+\.\s+/, ''))}</span></li>`; h += `<ol>${li}</ol>`; continue; }
    if (/^>/.test(l)) { const q = []; while (i < L.length && /^>/.test(L[i])) q.push(L[i++].replace(/^>\s?/, '')); h += `<p class="ozet">${inl(q.join(' '))}</p>`; continue; }
    const p = []; while (i < L.length && L[i].trim() && !blok.test(L[i])) p.push(L[i++]);
    h += `<p>${inl(p.join(' '))}</p>`;
  }
  return h;
}

function ahsapDoku() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  const tonlar = ['#D9A066', '#D49A5E', '#DDA770', '#CF9558', '#D8A36A'];

function camDuvar(x1, z1, x2, z2, h = 1.9, kapi = null) {
  // kapi: [baslangic, bitis] duvar boyunca 0..L aralığında boşluk
  const L = Math.hypot(x2 - x1, z2 - z1), dx = (x2 - x1) / L, dz = (z2 - z1) / L, aci = -Math.atan2(dz, dx);
  const parcalar = kapi ? [[0, kapi[0]], [kapi[1], L]] : [[0, L]];
  for (const [a, b] of parcalar) {
    const l = b - a; if (l <= .05) continue;
    const m = (a + b) / 2, cx = x1 + dx * m, cz = z1 + dz * m;
    const g = new THREE.Mesh(new THREE.BoxGeometry(l, h, .05), CAM); g.position.set(cx, h / 2, cz); g.rotation.y = aci; scene.add(g);
    const ust = new THREE.Mesh(new THREE.BoxGeometry(l, .06, .08), SIYAH); ust.position.set(cx, h, cz); ust.rotation.y = aci; scene.add(ust);
    const alt = new THREE.Mesh(new THREE.BoxGeometry(l, .05, .07), SIYAH); alt.position.set(cx, .03, cz); alt.rotation.y = aci; scene.add(alt);
    const n = Math.max(1, Math.round(l / 1.6));
    for (let k = 0; k <= n; k++) {
      const s = a + l * k / n;
      const p = new THREE.Mesh(new THREE.BoxGeometry(.06, h, .07), SIYAH);
      p.position.set(x1 + dx * s, h / 2, z1 + dz * s); scene.add(p);

  }
}

function boyutla(ilk) {
  const w = innerWidth, h = innerHeight, oran = w / h, yuk = 24;
  renderer.setSize(w, h);
  Object.assign(camera, { left: -yuk * oran / 2, right: yuk * oran / 2, top: yuk / 2, bottom: -yuk / 2 });
  if (ilk) camera.zoom = Math.max(.3, Math.min(1.15, (yuk * oran) / 44));
  camera.updateProjectionMatrix();
}

const gecici = new THREE.Vector3();
function etiketGuncelle() {
  const w = innerWidth, h = innerHeight;
  const uzak = h / (camera.top - camera.bottom) * camera.zoom < 24;
  if (uzak !== etiketGuncelle.uzak) { $('#etiketler').classList.toggle('uzak', uzak); etiketGuncelle.uzak = uzak; }
  for (const k of etiketler) {
    gecici.copy(k.pos).project(camera);
    const x = (gecici.x + 1) / 2 * w + k.ox, y = (1 - gecici.y) / 2 * h + k.oy;
    k.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)${k.donus || ''}`;
  }
}

function kameraOdakla(hedef, zoom) {
  if (azHareket) { controls.target.copy(hedef); camera.zoom = zoom; camera.updateProjectionMatrix(); controls.update(); return; }
  kameraHedef = { from: controls.target.clone(), to: hedef.clone(), fromZoom: camera.zoom, toZoom: zoom, t0: performance.now(), sure: 900 };
}

function ucur(kimden, kime) {
  const a = AJAN[kimden].pos.clone().setY(1.6), b = AJAN[kime].pos.clone().setY(1.6);
  if (azHareket) return;
  const kag = new THREE.Mesh(new THREE.BoxGeometry(.45, .05, .6), mat(0xFFFAED, { emissive: 0xE75F27, emissiveIntensity: .35 }));
  const ser = new THREE.Mesh(new THREE.BoxGeometry(.47, .02, .1), mat(0xE75F27)); ser.position.set(0, .04, -.18); kag.add(ser);
  kag.castShadow = true; scene.add(kag);
  ucanlar.push({ m: kag, a, b, t0: performance.now(), sure: 1300 });
}

function dongu(t) {
  requestAnimationFrame(dongu);
  if (kameraHedef) {
    const k = Math.min(1, (performance.now() - kameraHedef.t0) / kameraHedef.sure), e = 1 - Math.pow(1 - k, 3);
    controls.target.lerpVectors(kameraHedef.from, kameraHedef.to, e);
    camera.zoom = kameraHedef.fromZoom + (kameraHedef.toZoom - kameraHedef.fromZoom) * e; camera.updateProjectionMatrix();
    if (k >= 1) kameraHedef = null;
  }
  ucanlar = ucanlar.filter(u => {
    const k = Math.min(1, (performance.now() - u.t0) / u.sure);
    u.m.position.lerpVectors(u.a, u.b, k); u.m.position.y += Math.sin(Math.PI * k) * 4.5;
    u.m.rotation.y = k * Math.PI * 2;
    if (k >= 1) { scene.remove(u.m); return false; }
    return true;
  });
  const s = (t || 0) / 1000;
  for (const id in AJAN) {
    const A = AJAN[id];
    if (A.calisiyor) {
      A.ins.govdeMat.emissiveIntensity = .25 + Math.sin(s * 5) * .15;
      if (!azHareket) { A.ins.kollar[0].position.y = 1.02 + Math.sin(s * 18) * .03; A.ins.kollar[1].position.y = 1.02 + Math.cos(s * 18) * .03; A.ins.bas.rotation.x = Math.sin(s * 2) * .08; }
    } else if (A.ins.govdeMat.emissiveIntensity) { A.ins.govdeMat.emissiveIntensity = 0; }
  }
  controls.update();
  renderer.render(scene, camera);
  etiketGuncelle();
}

function balon(id, html, tur = '', ms = 0) {
  const A = AJAN[id]; if (!A) return;
  if (A.balon) { A.balon.el.remove(); etiketler.splice(etiketler.indexOf(A.balon), 1); A.balon = null; }
  if (!html) return;
  const el = document.createElement('div'); el.className = 'balon ' + tur; el.innerHTML = html;
  const k = etiketEkle(el, A.pos.clone().setY(2.35)); k.donus = ' translate(-50%, -100%)'; A.balon = k;
  if (ms) setTimeout(() => { if (A.balon === k) balon(id, null); }, ms);
}
const YAZIYOR = '<span class="yaziyor" aria-label="çalışıyor"><i></i><i></i><i></i></span>';

  const dep = $('#departmanlar');

  });

  $('#tus-tur').addEventListener('click', () => (tur.acik ? turuDurdur() : turuBaslat()));

  $('#tur-geri').addEventListener('click', () => turAdim(-1));

  $('#tus-akis').addEventListener('click', () => panelAc('akis'));

let acikKart = null;
async function kartAc(id, odakla) {
  const A = AJAN[id]; if (!A) return;
  acikKart = id;
  const d = DEP[A.departman];
  $('#kart-nokta').style.background = A.departman === 'yonetim' ? '#E75F27' : A.renk;
  $('#kart-dep').textContent = d ? d.ad : 'Yönetim';
  $('#kart-sira').textContent = `${SIRA.indexOf(id) + 1} / ${SIRA.length}`;
  $('#kart-ad').textContent = A.ad;
  $('#kart-aciklama').textContent = A.aciklama;
  $('#kart-baglanti').innerHTML = A.baglantilar.map(b => `<span class="cip">${esc(b)}</span>`).join('');
  const z = $('#kart-zaman');
  z.hidden = !A.zamanlama;
  if (A.zamanlama) z.innerHTML = `<b>${esc(A.zamanlama.saat)}</b> ${esc(zamanMetni(A.zamanlama))} kendiliğinden çalışır`;
  $('#kart-model').textContent = modelAd(A.model);
  $('#kart-ilerleme').style.background = A.departman === 'yonetim' ? '#E75F27' : A.renk;
  $('#kart-gorev').hidden = A.departman === 'yonetim';
  $('#tur-dur').textContent = tur.zamanlayici ? '⏸' : '▶';
  const cl = $('#kart-ciktilar'); cl.innerHTML = '';
  $('#kart').hidden = false;
  if (odakla) kameraOdakla(A.pos.clone().add(new THREE.Vector3(0, 0, 1)), 2.3);
  if (canli) {
    try {
      const liste = await (await fetch('/api/ciktilar/' + id)).json();
      if (acikKart !== id) return;
      cl.innerHTML = liste.slice(0, 3).map(f => `<button type="button" data-yol="${esc(f.yol)}">${esc(f.ad)}</button>`).join('');
      cl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => raporGetir(id, b.dataset.yol)));
    } catch {}
  }
}

/* ---- Ofis turu ---- */
const tur = { acik: false, i: 0, zamanlayici: null, t0: 0 };
const TUR_SURE = 4500;
function turuBaslat(devam) {
  tur.acik = true; if (!devam) tur.i = 0;
  $('#tus-tur').textContent = '■ Turu bitir';
  kartAc(SIRA[tur.i], true);
  clearInterval(tur.zamanlayici);
  tur.t0 = performance.now();
  tur.zamanlayici = setInterval(() => {
    const k = (performance.now() - tur.t0) / TUR_SURE;
    $('#kart-ilerleme').style.width = Math.min(100, k * 100) + '%';
    if (k >= 1) turAdim(1, true);
  }, 50);
  $('#tur-dur').textContent = '⏸';
}
function turAdim(y, oto) {
  tur.i = (tur.i + y + SIRA.length) % SIRA.length; tur.t0 = performance.now();
  if (!oto && !tur.zamanlayici) $('#kart-ilerleme').style.width = '0';
  if (!tur.acik) tur.i = (SIRA.indexOf(acikKart) + y + SIRA.length) % SIRA.length;
  kartAc(SIRA[tur.i], true);
}
function turuDurdur(sadeceDuraklat) {
  clearInterval(tur.zamanlayici); tur.zamanlayici = null;
  $('#tur-dur').textContent = '▶';
  if (!sadeceDuraklat) { tur.acik = false; $('#tus-tur').textContent = '▶ Ofisi gez'; $('#kart-ilerleme').style.width = '0'; }
}

/* ---- Paneller ---- */
let panelTuru = null;
const akis = [];
function panelAc(tip) {
  panelTuru = panelTuru === tip ? null : tip;
  $('#panel').hidden = !panelTuru;
  $('#tus-takvim').setAttribute('aria-pressed', panelTuru === 'takvim');
  $('#tus-akis').setAttribute('aria-pressed', panelTuru === 'akis');
  panelCiz();
}
function panelCiz() {
  if (!panelTuru) return;
  const ic = $('#panel-ic');
  if (panelTuru === 'takvim') {
    const z = OFIS.ajanlar.filter(a => a.zamanlama).sort((a, b) => a.zamanlama.saat.localeCompare(b.zamanlama.saat));
    $('#panel-baslik').innerHTML = `Zamanlanmış işler<small>${z.length} iş</small>`;
    ic.innerHTML = z.map(a => `<button class="satir" type="button" data-id="${a.id}">
      <div class="saat">${esc(a.zamanlama.saat)}<small>${esc(zamanMetni(a.zamanlama))}</small></div>
      <div style="min-width:0"><strong><i style="background:${AJAN[a.id].renk}"></i>${esc(a.ad)}</strong><span>${esc(a.zamanlama.gorev)}</span></div></button>`).join('')
      + `<p class="akis-bos">Saat geldiğinde sunucu (node server.js) açıksa iş kendiliğinden başlar.${canli ? '' : ' Şu an demo modundasınız.'}</p>`;
    ic.querySelectorAll('.satir').forEach(b => b.addEventListener('click', () => { turuDurdur(); kartAc(b.dataset.id, true); }));
  } else {
    $('#panel-baslik').innerHTML = `Akış<small>${canli ? 'canlı' : 'demo'}</small>`;
    ic.innerHTML = akis.length ? akis.slice().reverse().map((k, i) => `<div class="akis-satir ${k.hata ? 'hata' : ''}">
      <time>${saatYaz(k.t)}</time><div><b>${esc(k.kim)}</b> ${esc(k.mesaj)}${k.rapor ? `<br><button type="button" data-i="${akis.length - 1 - i}">Raporu aç</button>` : ''}</div></div>`).join('')
      : '<p class="akis-bos">Henüz iş yok. Aşağıdaki kutuya bir görev yazın.</p>';
    ic.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => akis[b.dataset.i].rapor()));
  }
}
function akisEkle(kim, mesaj, ek = {}) {
  akis.push({ t: new Date(), kim, mesaj, ...ek });
  if (akis.length > 80) akis.shift();
  if (panelTuru === 'akis') panelCiz();
}

/* ---- Rapor ---- */
function raporAc(ajanId, metin, ornek) {
  const A = AJAN[ajanId];
  const satirlar = metin.replace(/\r/g, '').split('\n');
  let baslik = A.ad, i = 0;
  while (i < satirlar.length && !satirlar[i].trim()) i++;
  if (/^#\s+/.test(satirlar[i] || '')) { baslik = satirlar[i].replace(/^#\s+/, ''); i++; }
  while (i < satirlar.length && !satirlar[i].trim()) i++;
  let ozet = '';
  if (satirlar[i] && !/^(#|\||\s*[-*]\s|\s*\d+\.)/.test(satirlar[i])) { ozet = satirlar[i]; i++; }
  $('#rapor-bas').style.background = `linear-gradient(135deg, ${A.renk}, color-mix(in srgb, ${A.renk} 70%, #1F1A17))`;
  $('#rapor-ust').textContent = `${A.ad} · ${DEP[A.departman] ? DEP[A.departman].ad : 'Yönetim'}`;
  $('#rapor-baslik').textContent = baslik;
  $('#rapor-tarih').textContent = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  $('#rapor-ornek').hidden = !ornek;
  $('#rapor-ic').innerHTML = (ozet ? `<p class="ozet">${inl(ozet)}</p>` : '') + md(satirlar.slice(i).join('\n'));
  $('#perde').hidden = false;
  $('#rapor-kapat').focus();
}
function raporKapat() { $('#perde').hidden = true; }
async function raporGetir(ajanId, yol) {
  try {
    const r = await fetch(yol); if (!r.ok) throw new Error(r.status);
    raporAc(ajanId, await r.text(), false);
  } catch (e) { akisEkle(AJAN[ajanId].ad, 'raporu açamadım: ' + e.message, { hata: true }); }
}

/* ======================= Görev akışı ======================= */
function olay(o) {
  const A = AJAN[o.ajan], ad = A ? A.ad : '';
  switch (o.tip) {
    case 'dusunuyor':
      calisiyorYap('genel-mudur', true);
      balon('genel-mudur', esc(o.mesaj || 'Bu iş kime gider, düşünüyorum…'));
      akisEkle('Genel Müdür', 'işi okuyor');
      kameraOdakla(AJAN['genel-mudur'].pos.clone().add(new THREE.Vector3(0, 0, 1)), 1.9);
      break;
    case 'devir':
      calisiyorYap('genel-mudur', false);
      balon('genel-mudur', `İşi <b>${esc(ad)}</b>'a veriyorum.`, '', 2200);
      $('#devir-kime').textContent = ad; $('#devir').hidden = false;
      setTimeout(() => { $('#devir').hidden = true; }, 3800);
      ucur('genel-mudur', o.ajan);
      akisEkle('Genel Müdür', `→ ${ad}${o.mesaj ? ' (' + o.mesaj + ')' : ''}`);
      setTimeout(() => kameraOdakla(A.pos.clone().add(new THREE.Vector3(0, 0, 1)), 2.3), azHareket ? 0 : 500);
      break;
    case 'aldi':
      balon(o.ajan, esc(o.mesaj), '', 2600);
      akisEkle(ad, o.mesaj.toLocaleLowerCase('tr'));
      break;
    case 'calisiyor':
      calisiyorYap(o.ajan, true);
      setTimeout(() => { if (A.calisiyor) balon(o.ajan, YAZIYOR); }, 2600);
      break;
    case 'bitti': {
      calisiyorYap(o.ajan, false);
      balon(o.ajan, 'Tamamdır, hazır ✓', 'tamam', 5000);
      const ac = o.ornek ? () => raporAc(o.ajan, o.ornek, true) : o.dosya ? () => raporGetir(o.ajan, o.dosya) : null;
      akisEkle(ad, o.dosya ? 'raporu hazırladı' : (o.mesaj || 'işi bitirdi'), { rapor: ac });
      if (ac) setTimeout(ac, azHareket ? 0 : 900);
      break;
    }
    case 'hata':
      for (const id in AJAN) if (AJAN[id].calisiyor) { calisiyorYap(id, false); balon(id, 'Bir sorun çıktı', 'hata', 4000); }
      akisEkle(ad || 'Ofis', o.mesaj, { hata: true });
      if (panelTuru !== 'akis') panelAc('akis');
      break;
    case 'kuyruk':
      if (o.sira > 1) akisEkle('Ofis', `iş sıraya alındı (${o.sira}. sırada)`);
      break;
    case 'not':
      akisEkle(ad || 'Ofis', o.mesaj);
      break;
  }
}

function anahtarla(metin) {
  const m = metin.toLocaleLowerCase('tr');
  let en = null, puan = 0;
  for (const a of OFIS.ajanlar) {
    const p = (a.anahtar || []).reduce((s, k) => s + (m.includes(k) ? k.length : 0), 0);
    if (p > puan) { puan = p; en = a; }
  }
  return en ? en.id : 'strateji-kocu';
}

async function demoCalistir(metin, kime) {
  const yeni = kime || 'genel-mudur';
  balon(yeni, 'Yeni iş geldi!', 'yeni', 1400);
  await bekle(1200);
  let hedef = kime;
  if (!hedef) {
    olay({ tip: 'dusunuyor', ajan: 'genel-mudur' });
    await bekle(1900);
    hedef = anahtarla(metin);
    olay({ tip: 'devir', ajan: hedef, mesaj: 'anahtar kelimeye göre' });
    await bekle(1500);
  } else {
    kameraOdakla(AJAN[hedef].pos.clone().add(new THREE.Vector3(0, 0, 1)), 2.3);
  }
  olay({ tip: 'aldi', ajan: hedef, mesaj: 'Görevi aldım: ' + (metin.length > 70 ? metin.slice(0, 70) + '…' : metin) });
  olay({ tip: 'calisiyor', ajan: hedef });
  await bekle(4200);
  olay({ tip: 'bitti', ajan: hedef, ornek: ORNEK[hedef] || genelOrnek(AJAN[hedef], metin) });
}

let mesgul = false;
async function gorevVer() {
  const metin = $('#komut-metin').value.trim();
  const kime = $('#komut-kime').value;
  if (!metin) { $('#komut-metin').focus(); return; }
  turuDurdur(); $('#kart').hidden = true;
  const demo = $('#komut-demo').checked || !canli;
  if (demo) {
    if (mesgul) return;
    mesgul = true; $('#komut-gonder').disabled = true;
    try { await demoCalistir(metin, kime); } finally { mesgul = false; $('#komut-gonder').disabled = false; }
  } else {
    try {
      const r = await fetch('/api/gorev', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ metin, kime: kime || null }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.hata || r.status);
      balon(kime || 'genel-mudur', 'Yeni iş geldi!', 'yeni', 1600);
      akisEkle('Siz', metin);
    } catch (e) { akisEkle('Ofis', 'görev gönderilemedi: ' + e.message, { hata: true }); }
  }
  $('#komut-metin').value = '';
}

async function durumKontrol() {
  try {
    const ac = new AbortController(); const zt = setTimeout(() => ac.abort(), 1500);
    const r = await fetch('/api/durum', { signal: ac.signal, cache: 'no-store' }); clearTimeout(zt);
    canli = r.ok && (await r.json()).canli === true;
  } catch { canli = false; }
  const d = $('#durum');
  d.classList.toggle('canli', canli);
  d.querySelector('span').textContent = canli ? 'Canlı · ' + location.host : 'Demo modu';
  $('#komut-demo').checked = !canli;
  $('#komut-demo').disabled = !canli;
  $('#komut-demo').parentElement.title = canli ? 'İşaretlerseniz gerçek iş yapılmaz, sadece canlandırılır.' : 'Sunucu kapalı: bilgisayarda "node server.js" çalıştırın.';
  if (canli) {
    const es = new EventSource('/api/olaylar');
    es.onmessage = e => { try { olay(JSON.parse(e.data)); } catch {} };
  }
}

async function basla() {
  try {
    const r = await fetch('ofis.json', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
    OFIS = await r.json();
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', `<div class="hata-ekran"><div><h2>Ofis yüklenemedi</h2><p>ofis.json okunamadı (${esc(e.message)}). Klasörde <code>node server.js</code> çalıştırıp http://127.0.0.1:4747 adresini açın.</p></div></div>`);
    return;
  }
  if (!window.THREE || !THREE.OrbitControls) {
    document.body.insertAdjacentHTML('beforeend', '<div class="hata-ekran"><p>3B kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.</p></div>');
    return;
  }
  sahneKur(); arayuzKur(); requestAnimationFrame(dongu);
  await durumKontrol();
  setTimeout(() => balon('genel-mudur', 'Ofis hazır. Bir görev yazın, doğru kişiye ileteyim.', '', 5000), 600);
}
basla();
</script>
